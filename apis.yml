name: BTI Systems (Juniper)
description: 'BTI Systems was an Ottawa, Ontario based supplier of cloud and metro packet-optical
  networking systems and software, best known for the BTI 7800 Series Packet Optical Transport
  platform, the BTI 800 Series, and the proNX family of management software (proNX Service Manager
  and proNX Optical Director). Juniper Networks acquired the remaining ownership interest in BTI
  Systems for approximately $25.8 million in cash, closing the acquisition on April 1, 2016, to
  accelerate open and automated packet-optical transport and SDN/NFV capabilities. BTI no longer
  operates as an independent company and publishes no independent developer portal or public API;
  the BTI Series and proNX product lines are documented and supported under Juniper Networks, whose
  proNX Optical Director exposes REST APIs northbound for OSS/BSS integration with NETCONF and
  telemetry southbound. This profile is retained as an acquired-company record in the API Evangelist
  network, with the live vendor surface tracked in the juniper-networks profile.'
